# ==============================================================================
# StreamFab - Production Nginx Configuration
# Optimized for SSE Progress Streaming, Range Requests & Zero-Copy Passthrough
# ==============================================================================

# Rate limiting zone: 20 requests per second per IP
limit_req_zone $binary_remote_addr zone=streamfab_limit:10m rate=20r/s;

upstream streamfab_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name streamfab.yourdomain.com;

    # Redirect all HTTP traffic to HTTPS (uncomment when SSL is installed)
    # return 301 https://$host$request_uri;

    client_max_body_size 3M;

    # Protect this single-user service with reverse-proxy authentication.
    # Configure a TLS certificate before exposing it outside localhost.
    auth_basic "StreamFab";
    auth_basic_user_file /etc/nginx/streamfab.htpasswd;

    # Gzip Compression for static assets & JSON
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 1. Real-Time Server-Sent Events (SSE) Progress Streaming
    # Critical: Disable proxy buffering and set high timeout for persistent connection
    location ~ ^/api/progress/ {
        limit_req zone=streamfab_limit burst=10 nodelay;
        proxy_pass http://streamfab_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering so SSE chunks stream instantaneously
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # 2. Zero-Copy Media Streaming Proxy (Client-Side Compute)
    # Critical: Support Range requests (206 Partial Content) and streaming byte passthrough
    location /api/proxy-stream {
        limit_req zone=streamfab_limit burst=30 nodelay;
        proxy_pass http://streamfab_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass through Range header and disable buffering
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 3. Static Assets (CSS, JS, Vendor, Images)
    location /static/ {
        proxy_pass http://streamfab_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # 4. Standard API & Web UI Routes
    location / {
        limit_req zone=streamfab_limit burst=20 nodelay;
        proxy_pass http://streamfab_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
