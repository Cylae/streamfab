services:
  streamfab:
    build:
      context: .
      dockerfile: Dockerfile
    image: streamfab:latest
    container_name: streamfab_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - STREAMFAB_HOST=0.0.0.0
      - STREAMFAB_PORT=8000
      - STREAMFAB_STORAGE_DIR=/app/downloads
      - STREAMFAB_COOKIES_FILE=/app/state/cookies.txt
      - STREAMFAB_TRUSTED_HOSTS=${STREAMFAB_TRUSTED_HOSTS:-localhost,127.0.0.1}
      - STREAMFAB_ADMIN_TOKEN=${STREAMFAB_ADMIN_TOKEN:-}
    volumes:
      - streamfab_downloads:/app/downloads
      - streamfab_state:/app/state
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.25"
          memory: 256M

volumes:
  streamfab_downloads:
    driver: local

  streamfab_state:
    driver: local
